# Web-tier nginx config: serve the built React SPA and reverse-proxy the API.
#
# This is the config the web tier runs in production. The frontend calls
# relative "/api/..." URLs (never a hardcoded backend address), and nginx
# forwards those to the app tier — locally the backend service, in AWS the
# internal load balancer.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy. IMPORTANT: no trailing slash on proxy_pass, so the "/api"
    # prefix is preserved — the backend mounts its routes under "/api". Adding a
    # trailing slash would strip "/api" and every request would 404.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
