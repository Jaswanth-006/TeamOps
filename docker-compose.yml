services:
  postgres:
    image: postgres:16
    container_name: teamops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamops
      POSTGRES_PASSWORD: teamops
      POSTGRES_DB: teamops
    ports:
      - "5432:5432"
    volumes:
      - teamops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamops -d teamops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  teamops_pgdata:
