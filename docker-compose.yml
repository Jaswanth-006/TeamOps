services:
  postgres:
    image: postgres:16
    container_name: teamops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamops
      POSTGRES_PASSWORD: teamops
      POSTGRES_DB: teamops
    ports:
      - "5432:5432"
    volumes:
      - teamops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamops -d teamops"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: teamops-backend
    restart: unless-stopped
    environment:
      # Connects to the postgres service by name, not localhost — the same way
      # the app tier will reach the database over the network on AWS.
      DATABASE_URL: "postgresql://teamops:teamops@postgres:5432/teamops?schema=public"
      JWT_SECRET: "local-dev-secret-not-for-production-8f3a2b"
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: teamops-frontend
    restart: unless-stopped
    # nginx serves the built SPA and proxies /api to the backend service,
    # mirroring the web tier in front of the app tier on AWS.
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  teamops_pgdata:
